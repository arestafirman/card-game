<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall Duel — a card duel of four winds</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1a12; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { width: 1280px; height: 720px; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Emberfall Duel: a card duel against Seraphine. Play cards to win tricks, wound her life to zero, and mind the sets, resonances and combos."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
